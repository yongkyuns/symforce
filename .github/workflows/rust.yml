name: Rust validation

on:
  push:
    branches: [main, codex/rust-performance-parity]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  runtime:
    name: Rust runtime and no_std
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup target add thumbv7em-none-eabihf
          rustc --version --verbose
          cargo --version
      - name: Runtime unit, integration, and example targets
        run: cargo test --locked --manifest-path rust/symforce/Cargo.toml --all-targets
      - name: Documentation tests
        run: cargo test --locked --manifest-path rust/symforce/Cargo.toml --doc
      - name: Geometry without std
        run: cargo check --locked --manifest-path rust/symforce/Cargo.toml --no-default-features
      - name: IMU without std
        run: cargo check --locked --manifest-path rust/symforce/Cargo.toml --no-default-features --features imu
      - name: Bare-metal geometry and IMU
        run: |
          cargo check --locked --manifest-path rust/symforce/Cargo.toml --no-default-features --target thumbv7em-none-eabihf
          cargo check --locked --manifest-path rust/symforce/Cargo.toml --no-default-features --features imu --target thumbv7em-none-eabihf
      - name: Build all Rust example packages
        run: |
          set -euo pipefail
          while IFS= read -r manifest; do
            echo "Checking $manifest"
            cargo check --locked --all-targets --manifest-path "$manifest"
          done < <(find symforce/examples -path '*/rust/Cargo.toml' -type f | sort)
      - name: Runtime formatting
        run: cargo fmt --manifest-path rust/symforce/Cargo.toml --all -- --check
